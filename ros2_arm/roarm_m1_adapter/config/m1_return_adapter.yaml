# M1 no-contact return adapter — inert by default.
#
# All authorization fields start empty.  The adapter will NOT create a target
# publisher or arm client until the ~/authorize_return service is called and
# every precondition passes.
#
# Required authorization parameters (set before calling the service):
#   authorization_token_id
#   authorization_artifact_sha256
#   authorization_start_measured_digest
#   authorization_expires_monotonic
#   authorization_confirmation_text

roarm_m1_return_adapter:
  ros__parameters:
    artifact_path: ""
    step_timeout_sec: 20.0
    authorization_token_id: ""
    authorization_artifact_sha256: ""
    authorization_start_measured_digest: ""
    authorization_expires_monotonic: 0.0
    authorization_confirmation_text: ""
