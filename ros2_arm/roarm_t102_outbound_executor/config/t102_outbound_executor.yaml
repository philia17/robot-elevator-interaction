# Disabled by default.  A deployment must explicitly provide the sealed route
# and exact six-joint Standby vector; no default can move hardware.
roarm_t102_outbound_executor:
  ros__parameters:
    execution_enabled: false
    prepared_route_json: ""
    prepared_route_sha256: ""
    supervised_release_json: ""
    supervised_release_sha256: ""
    standby_joint_positions_rad: []
    standby_tolerance_rad: 0.02
    max_feedback_age_s: 0.25
    step_timeout_s: 30.0
    waypoint_tolerance_rad: 0.02
    field_context_json: '{}'
