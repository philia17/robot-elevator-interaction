pulse_source: "REPLACE_ON_AGX_WITH_STABLE_PULSE_SOURCE"
pulse_sink: "REPLACE_ON_AGX_WITH_STABLE_PULSE_SINK"
wake_prompt: "REPLACE_ON_AGX_WITH_WAKE_PROMPT_WAV"
confirm_prompt: "REPLACE_ON_AGX_WITH_CONFIRM_PROMPT_WAV"
floor_confirm_prompt_dir: "REPLACE_ON_AGX_WITH_FLOOR_CONFIRM_PROMPT_DIR"
confirmed_prompt: "REPLACE_ON_AGX_WITH_CONFIRMED_PROMPT_WAV"
mismatch_prompt: "REPLACE_ON_AGX_WITH_MISMATCH_PROMPT_WAV"
retry_prompt: "REPLACE_ON_AGX_WITH_RETRY_PROMPT_WAV"
