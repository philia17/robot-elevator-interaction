# Development/validation profile. Confirm names with `pactl` on the Orin Nano.
usb_vid: "0c76"
usb_pid: "161f"
pulse_source: "alsa_input.usb-0c76_USB_PnP_Audio_Device-00.analog-stereo"
pulse_sink: "alsa_output.usb-0c76_USB_PnP_Audio_Device-00.analog-stereo"
wake_prompt: "/opt/robot-elevator-interaction/voice_control/prompts/ready_zh.wav"
confirm_prompt: "/opt/robot-elevator-interaction/voice_control/prompts/confirm_floor_zh.wav"
floor_confirm_prompt_dir: "/opt/robot-elevator-interaction/voice_control/prompts/floors"
confirmed_prompt: "/opt/robot-elevator-interaction/voice_control/prompts/confirmed_dry_run_zh.wav"
mismatch_prompt: "/opt/robot-elevator-interaction/voice_control/prompts/floor_mismatch_zh.wav"
retry_prompt: "/opt/robot-elevator-interaction/voice_control/prompts/retry_zh.wav"
timeout_prompt: "/opt/robot-elevator-interaction/voice_control/prompts/timeout_zh.wav"
cancel_prompt: "/opt/robot-elevator-interaction/voice_control/prompts/cancelled_zh.wav"
stop_prompt: "/opt/robot-elevator-interaction/voice_control/prompts/stopped_dry_run_zh.wav"
english_prompt_dir: "/opt/robot-elevator-interaction/voice_control/prompts/en"
english_floor_confirm_prompt_dir: "/opt/robot-elevator-interaction/voice_control/prompts/en/floors"
prompt_volume_percent: 50
playback_timeout_seconds: 10
post_playback_guard_seconds: 0.5
# Lightweight energy VAD; tune vad_rms_threshold from live peak_rms observations.
vad_rms_threshold: 300
vad_chunk_ms: 30
vad_start_ms: 90
vad_silence_ms: 600
vad_preroll_ms: 240
vad_min_speech_ms: 150
vad_max_utterance_seconds: 8
# UNKNOWN speech at or below both limits is silently ignored. Valid commands
# are parsed first and are never removed by these limits.
short_unknown_max_seconds: 1.0
short_unknown_max_chars: 2
# Legacy compatibility field; punctuation-only ASR is now always silent.
no_speech_retry_peak_rms: 10000
session_awake_timeout_seconds: 30
dry_run: true
floor_min: -2
floor_max: 40
confirmation_ttl_seconds: 30
audit_dir: ""
# SenseVoice files are copied separately and never included in the wheel.
model_dir: "/opt/robot-elevator-interaction/voice_control/models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17"
model: ""
tokens: ""
# Reserved for a future neural VAD model; the current session uses energy settings above.
vad: ""
# Legacy compatibility alias; leave empty when using model/model_dir.
model_path: ""
model_sha256: "c71f0ce00bec95b07744e116345e33d8cbbe08cef896382cf907bf4b51a2cd51"
asr_num_threads: 2
asr_provider: "cpu"
max_audio_bytes: 16777216
